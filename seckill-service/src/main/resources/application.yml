server:
  port: 18084

spring:
  application:
    name: seckill-service
  config:
    # 导入按声明序处理、后声明者优先：.env 先加载，保证 Nacos 连接参数可解析；Nacos 配置优先覆盖本地
    import:
      - optional:file:.env[.properties]
      - optional:nacos:seckill-service.yml
  # Spring Cloud 服务发现（供网关 lb:// 解析实例）；namespace 保持 public，隔离靠 group
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        group: SECKILL_DISCOVERY
      # 配置中心（准入参数动态化）：Data ID=seckill-service.yml，group=SECKILL_CONFIG；不写 namespace 即 public
      # Nacos 不可用/未建配置时 optional 不阻塞启动，SeckillConfig 类内默认值兜底
      config:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        group: SECKILL_CONFIG
        file-extension: yml
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

dubbo:
  application:
    name: seckill-service
    qos-enable: false
  registry:
    # namespace 保持 public，隔离靠 group（与 Spring Cloud 的 SECKILL_DISCOVERY 隔离）
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}&group=SECKILL_DUBBO
  consumer:
    check: false
    # 重试不设全局默认，逐引用按读写性质在 @DubboReference(retries = n) 上显式声明
    # 下单/支付链路含多段远程调用，默认 1s 偏短
    timeout: 3000

rocketmq:
  name-server: ${ROCKETMQ_ADDR}
  producer:
    group: seckill-producer
    # 首次向新 topic 发送时 broker 自动创建较慢，默认 3s 易误报超时
    send-message-timeout: 5000
