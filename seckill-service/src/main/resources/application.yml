server:
  port: 8084

spring:
  application:
    name: seckill-service
  data:
    redis:
      host: localhost
      port: 6379

dubbo:
  application:
    name: seckill-service
    qos-enable: false
  registry:
    address: nacos://127.0.0.1:8848
  consumer:
    check: false

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: seckill-producer-group
