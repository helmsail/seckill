server:
  port: 18084

spring:
  application:
    name: seckill-service
  config:
    import:
      - optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

dubbo:
  application:
    name: seckill-service
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}
  consumer:
    check: false
    # 下单/支付链路含多段远程调用，默认 1s 偏短
    timeout: 3000

rocketmq:
  name-server: ${ROCKETMQ_ADDR}
  producer:
    group: seckill-producer
