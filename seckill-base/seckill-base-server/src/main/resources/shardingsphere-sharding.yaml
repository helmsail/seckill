# 数据源占位符由 application.yml 中 url 的 ?placeholder-type=environment 开启
# 语法 ${KEY::默认值}，KEY 从环境变量（.env 注入）读取，格式为 SS 专有语法（必须带 ::）
dataSources:
  ds_0:
    url: jdbc:mysql://${MYSQL_HOST::}:${MYSQL_PORT::}/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME::}
    password: ${MYSQL_PASSWORD::}
    driverClassName: com.mysql.cj.jdbc.Driver

rules:
  - !SHARDING
    tables:
      sk_order:
        actualDataNodes: ds_0.sk_order_$->{0..3}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: sk_order_inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake
    shardingAlgorithms:
      sk_order_inline:
        type: INLINE
        props:
          algorithm-expression: sk_order_$->{user_id % 4}
    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  sql-show: true
