server:
  port: 18081

spring:
  application:
    name: seckill-base-server
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-sharding.yaml?placeholder-type=environment

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dubbo:
  application:
    name: seckill-base-server
    qos-enable: false
  registry:
    # namespace 保持 public，隔离靠 group（与 Spring Cloud 的 SECKILL_DISCOVERY 隔离）
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}&group=SECKILL_DUBBO
  protocol:
    name: dubbo
    port: 28081
