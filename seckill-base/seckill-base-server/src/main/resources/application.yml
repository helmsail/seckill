server:
  port: 8081

spring:
  application:
    name: seckill-base-server
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-sharding.yaml
    username: root
    password: root

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dubbo:
  application:
    name: seckill-base-server
    qos-enable: false
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20881

jwt:
  secret: seckill-jwt-secret-key-must-be-at-least-256-bits-long!!
  expiration: 86400000
