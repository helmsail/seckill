server:
  port: 18082

spring:
  application:
    name: seckill-admin
  config:
    import:
      - optional:file:.env[.properties]

dubbo:
  application:
    name: seckill-admin
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}
  consumer:
    check: false
    # 写编排（循环划拨+批量落库）用默认 1s 超时偏短，放宽以降低假失败概率
    timeout: 3000
