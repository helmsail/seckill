server:
  port: 18082

spring:
  application:
    name: seckill-admin
  config:
    import:
      - optional:file:.env[.properties]
  # Spring Cloud 服务发现（供网关 lb:// 解析实例）；namespace 保持 public，隔离靠 group
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        group: SECKILL_DISCOVERY
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

dubbo:
  application:
    name: seckill-admin
    qos-enable: false
  registry:
    # namespace 保持 public，隔离靠 group（与 Spring Cloud 的 SECKILL_DISCOVERY 隔离）
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}&group=SECKILL_DUBBO
  consumer:
    check: false
    # 重试不设全局默认，逐引用按读写性质在 @DubboReference(retries = n) 上显式声明
    # 默认 1s 超时偏短故放宽
    timeout: 3000
