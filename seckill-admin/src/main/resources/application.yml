server:
  port: 18082

spring:
  application:
    name: seckill-admin
  config:
    import:
      - optional:file:.env[.properties]

dubbo:
  application:
    name: seckill-admin
    qos-enable: false
  registry:
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}
  consumer:
    check: false
    # 写编排（活动创建/划拨等非幂等操作）禁用自动重试，防止重复写入；默认 1s 超时偏短故放宽
    retries: 0
    timeout: 3000
