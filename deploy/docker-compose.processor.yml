# 秒杀系统 · v6 架构(2026-10)——processor 独占(4C8G;IP 由 .env HOST_IP 注入)
#
# 【一组件一机】单一 processor 实例:200 消费线程(v1.2 镜像注解固化;8 队列由单实例统一消费,分配更均匀)。
#   - 消费能力标定:40 线程(单条含 3 次串行 base 调用)≈ 2400/s → 200 线程 ≈ 1 万/s 级,4000/s 目标余量充足;
#   - cpus 3.5(4 核机留 0.5 给系统);堆 1g(200 个消费线程栈 ~200m + 业务堆);
#   - 不映射端口(容器内 18085);无状态,重建即恢复。
# 启动:docker compose -f docker-compose.processor.yml up -d
name: seckill-processor

services:

  seckill-processor:
    image: ${IMAGE_REGISTRY}/seckill-processor:${PROCESSOR_IMAGE_TAG}
    container_name: seckill-processor
    cpus: 3.5
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "${PROCESSOR_JAVA_OPTS}"
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}

networks:
  default:
    name: seckill-net
