# 秒杀系统 · 服务器部署拆分（D2 缓存与支撑节点 · 4C8G）——Redis + support
#
# 【N 拓扑说明】13 台实测收敛版（按比例激进合并）：
#   - Redis（~2.4 核）+ support（~1.1 核）合一台（@5000 极限 ~88% / @4000 生产档 70%）：Redis 单线程快层 +
#     低频业务支撑，互不干扰（support 直接读同侧缓存/库）；
#   - web（nginx）已并到 D1 台（见 docker-compose.mysql.yml）。
#
# 启动：docker compose -f docker-compose.cache.yml up -d
# 更新：docker compose -f docker-compose.cache.yml pull && docker compose -f docker-compose.cache.yml up -d
name: seckill-cache

services:

  redis:
    # 官方镜像经 ACR 中转（服务器直连 Docker Hub 不稳定）
    image: ${IMAGE_REGISTRY}/redis:7-alpine
    container_name: seckill-redis
    cpus: 2.6
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  seckill-support:
    image: ${IMAGE_REGISTRY}/seckill-support:${IMAGE_TAG}
    container_name: seckill-support
    cpus: 1.3
    restart: unless-stopped
    env_file: .env
    environment:
      # 堆（默认值；要调整在 .env ⑤ 区设 SUPPORT_JAVA_OPTS 覆盖）
      JAVA_TOOL_OPTIONS: "${SUPPORT_JAVA_OPTS:--Xms1536m -Xmx1536m}"
      # 跨机 Dubbo 调用不能注册容器内网 IP（注册宿主内网 IP + 端口映射见 ports）
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}
    ports:
      - "${SUPPORT_PORT}:${SUPPORT_PORT}"
      - "${SUPPORT_DUBBO_PORT}:${SUPPORT_DUBBO_PORT}"
