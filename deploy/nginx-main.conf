# 秒杀前端 web 机 nginx 主配置(高并发连接数;挂载覆盖镜像默认 /etc/nginx/nginx.conf)
# 关键差异(vs 官方默认):
#   1) events.worker_connections 1024 -> 65535(压测高并发必需,默认值会导致
#      "1024 worker_connections are not enough, reusing connections" 并挤爆 CPU)
#   2) worker_rlimit_nofile 65535(单 worker 文件描述符上限)
#   3) server 段(vhost)由 /etc/nginx/conf.d/default.conf 提供(envsubst 生成)

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志:常规开启(请求级可审计);docker 日志已配 50m×2 轮转,不必担心磁盘
    access_log  on;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
}
