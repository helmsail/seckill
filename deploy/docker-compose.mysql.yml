# 秒杀系统 · v6 架构(2026-10)——MySQL 独占(4C8G;IP 由 .env HOST_IP 注入)
#
# 【一组件一机】数据库独立部署:
#   - 4000 档预估 ~3.5/4 核(临界水位)——压测盯 CPU,持续 >90% 建议本机升 8C16G(其余机器不动);
#   - 参数:buffer pool 2G(2026-10-08 调优,原 1G)/ max-connections 500 / mem_limit 4g / cpus 3.5;其余全走 MySQL 默认;
#   - 无数据卷(压测语义):数据在容器可写层;`docker compose down && up -d` 即自动重建
#     (initdb 重跑 → 建库建表 + 种子 + 10 万压测账号);仅 `restart` 不重置(容器未删)。
# 启动:docker compose -f docker-compose.mysql.yml up -d
name: seckill-mysql

services:

  mysql:
    image: ${IMAGE_REGISTRY}/mysql:8.0
    container_name: seckill-mysql
    cpus: 3.5
    mem_limit: 4g
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=2G --max-connections=500
    ports:
      - "3306:3306"
    volumes:
      # 首次初始化(数据目录为空时自动执行):建库建表 + 基础数据 + 压测种子,按字母序执行
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
    name: seckill-net
