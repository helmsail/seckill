# 秒杀前端站点(云端版 · envsubst 模板):静态页面 + /api 反向代理到网关(同源免 CORS)
# 本文件是【模板】:容器启动时由 nginx 官方入口脚本(20-envsubst-on-templates.sh)将
#   ${GATEWAY1_ADDR} 替换为环境变量值,生成 /etc/nginx/conf.d/default.conf。
#   - 值来自 .env ① 区的 GATEWAY1_ADDR(格式 "内网IP:端口");
#   - 挂载位置见 docker-compose.web.yml(/etc/nginx/templates/default.conf.template);变量缺失会导致启动失败(fail-fast);
#   - 网关 3 实例(172.30.216.103/104/105;扩容=改此处 server 行 + deploy_push.py 的 GATEWAY_ADDR)。

upstream gateway_cluster {
    # 网关 3 实例(负载均衡)
    server ${GATEWAY1_ADDR};
    server ${GATEWAY2_ADDR};
    server ${GATEWAY3_ADDR};
    keepalive 64;
}

server {
    # host 网络模式:直接监听宿主机端口,由 ${WEB_PORT} 注入(见 docker-compose.web.yml 的 network_mode: host)
    listen ${WEB_PORT};

    # 访问日志:常规开启(docker 日志已配 50m×2 轮转)
    access_log on;

    # 静态页面（C 端 index.html，运营端 admin.html）
    root /usr/share/nginx/html;
    index index.html;

    # 管理端快捷入口
    location = /admin {
        return 302 /admin.html;
    }

    # API 统一走网关集群（保留 /api 前缀原样转发）；批量压测也建议打本入口，由 nginx 分摊到 3 台网关
    location /api/ {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
