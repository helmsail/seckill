# 秒杀前端站点（云端版）：静态页面 + /api 反向代理到"网关集群"（同源免 CORS）
# ⚠️ 本文件的 upstream 内地址 = G1~G2 两台网关的内网 IP（端口 18080），部署时务必改成真实值；
#    网关机 IP 变化后同步修改并 `docker restart seckill-web`（或 compose up -d 重建）。
# 本文件由 mysql.yml（D1 台）挂载覆盖镜像内置的单网关版（本地单机仍用镜像内置版，无需改）。

upstream gateway_cluster {
    # G1~G2 网关节点（示例 IP，部署时替换）
    server 172.30.216.201:18080;
    server 172.30.216.202:18080;
    keepalive 64;
}

server {
    listen 80;

    # 静态页面（C 端 index.html，运营端 admin.html）
    root /usr/share/nginx/html;
    index index.html;

    # 管理端快捷入口
    location = /admin {
        return 302 /admin.html;
    }

    # API 统一走网关集群（保留 /api 前缀原样转发）；批量压测也建议打本入口，由 nginx 分摊到 3 台网关
    location /api/ {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
