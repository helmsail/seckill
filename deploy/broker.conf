brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 容器网络内 NameServer 地址
namesrvAddr=rocketmq-namesrv:9876
# Broker 注册地址：占位符由 compose 启动时用 .env 的 HOST_IP 注入（台 6 宿主 IP）
# 跨机应用从 NameServer 拿到该地址后按 台6IP:10911 连接（端口已做宿主映射）
brokerIP1=__HOST_IP__
# 允许自动创建 Topic（订单同步等新 Topic 免预建）
autoCreateTopicEnable=true
