# 秒杀系统 · 服务器部署拆分（台 6）——Nacos + RocketMQ + Sentinel + XXL-Job
#
# 启动：docker compose -f docker-compose.middleware.yml up -d        （镜像从 .env 的 IMAGE_REGISTRY 拉取，无需源码/构建环境）
# 更新：docker compose -f docker-compose.middleware.yml pull && docker compose -f docker-compose.middleware.yml up -d
#
# 必要项提示（混部机，勿删）：
#   - 本台 5 个 JVM 混部，各堆已显式限制（JVM_XMX / JAVA_OPT_EXT / JAVA_OPTS），不限制会互相挤爆；
#   - xxl-job-admin 的 MySQL 指向台 1（${MYSQL_HOST} 在 .env 中配为台 1 内网 IP）——跨机不随本 compose 启动
name: seckill-middleware

services:

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: seckill-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

  rocketmq-namesrv:
    image: ${IMAGE_REGISTRY}/seckill-rocketmq:${IMAGE_TAG}
    container_name: seckill-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: ${IMAGE_REGISTRY}/seckill-rocketmq:${IMAGE_TAG}
    container_name: seckill-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      # 显式限制堆（RocketMQ 脚本默认按物理内存比例分配，不限制会撑爆容器）
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      # broker.conf 随部署包分发：把 docker/rocketmq/broker.conf 复制到本目录（与 compose 同级）
      - ./broker.conf:/home/rocketmq/conf/broker.conf:ro

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.5.0
    container_name: seckill-xxl-job-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xmx1g"
      # 调度库在台 1（跨机用内网 IP；未导入 xxl_job 表前会反复重启，导入后自动恢复）
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USERNAME:-root}
        --spring.datasource.password=${MYSQL_PASSWORD:-root}
        --xxl.job.accessToken=
    ports:
      - "8080:8080"

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: seckill-sentinel-dashboard
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xmx512m -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "8858:8858"
