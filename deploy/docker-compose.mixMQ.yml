# 秒杀系统 · v6 架构(2026-10)——混合机 MQ:MQ + 管理面组(4C8G;IP 由 .env HOST_IP 注入)
#
# 【混合编排】消息队列 + 管理面 6 服务共置(4000 档预估 ~2.9/4 核 = 73%):
#   - rocketmq:namesrv + broker 同机(brokerIP1 由 HOST_IP 注入);无持久化卷(压测语义,重建即重置);
#   - 管理面:nacos / sentinel / xxl-job-admin / job(执行器同机) / admin(运营端);
#   - ⚠️ xxl-job-admin 依赖 MySQL 机的 xxl_job 库(由 mysql 机 initdb 导入;未导入前反复重启属正常)。
# 启动:docker compose -f docker-compose.mixMQ.yml up -d
name: seckill-mixmq

services:

  # ---------- 消息队列 ----------
  rocketmq-namesrv:
    image: ${IMAGE_REGISTRY}/seckill-rocketmq:${IMAGE_TAG}
    container_name: seckill-rocketmq-namesrv
    cpus: 0.5
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "${NAMESRV_JAVA_OPT_EXT}"
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: ${IMAGE_REGISTRY}/seckill-rocketmq:${IMAGE_TAG}
    container_name: seckill-rocketmq-broker
    cpus: 2.0
    restart: unless-stopped
    # 启动时注入 brokerIP1(本机 HOST_IP)与 namesrvAddr(.env 的 ROCKETMQ_ADDR = 本机 namesrv)
    command: sh -c "sed -e 's/__HOST_IP__/${HOST_IP}/' -e 's/__NAMESRV_ADDR__/${ROCKETMQ_ADDR}/' /conf-template/broker.conf > /tmp/broker.conf && sh mqbroker -c /tmp/broker.conf"
    environment:
      JAVA_OPT_EXT: "${BROKER_JAVA_OPT_EXT}"
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./broker.conf:/conf-template/broker.conf:ro

  # ---------- 管理面 ----------
  nacos:
    image: ${IMAGE_REGISTRY}/nacos:v2.3.2
    container_name: seckill-nacos
    cpus: 0.5
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: ${NACOS_JVM_XMS}
      JVM_XMX: ${NACOS_JVM_XMX}
    ports:
      - "8848:8848"
      - "9848:9848"

  sentinel-dashboard:
    image: ${IMAGE_REGISTRY}/sentinel-dashboard:1.8.8
    container_name: seckill-sentinel-dashboard
    cpus: 0.3
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 端口三处同源(.env ④ SENTINEL_PORT;改后同步 ① SENTINEL_DASHBOARD_ADDR)
      JAVA_OPTS: "${SENTINEL_JAVA_OPTS} -Dserver.port=${SENTINEL_PORT} -Dcsp.sentinel.dashboard.server=localhost:${SENTINEL_PORT} -Dproject.name=sentinel-dashboard"
    ports:
      - "${SENTINEL_PORT}:${SENTINEL_PORT}"

  xxl-job-admin:
    image: ${IMAGE_REGISTRY}/xxl-job-admin:2.5.0
    container_name: seckill-xxl-job-admin
    cpus: 0.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${XXL_JAVA_OPTS}"
      # 调度库在 MySQL 独立机;未导入 xxl_job 表前会反复重启(导入后自动恢复)
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USERNAME}
        --spring.datasource.password=${MYSQL_PASSWORD}
        --xxl.job.accessToken=
    ports:
      - "${XXL_ADMIN_PORT}:8080"

  seckill-job:
    image: ${IMAGE_REGISTRY}/seckill-job:${IMAGE_TAG}
    container_name: seckill-job
    cpus: 0.4
    restart: unless-stopped
    env_file: .env
    environment:
      # -Dxxl.job.executor.address=宿主内网 IP:xxl-admin 与执行器同机(本机)
      JAVA_TOOL_OPTIONS: "${JOB_JAVA_OPTS} -Dxxl.job.executor.address=http://${HOST_IP}:${XXL_EXECUTOR_PORT}/"
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}
    ports:
      - "${JOB_PORT}:${JOB_PORT}"
      - "${XXL_EXECUTOR_PORT}:${XXL_EXECUTOR_PORT}"

  seckill-admin:
    image: ${IMAGE_REGISTRY}/seckill-admin:${IMAGE_TAG}
    container_name: seckill-admin
    cpus: 0.3
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "${ADMIN_JAVA_OPTS}"
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${HOST_IP}
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"

networks:
  default:
    name: seckill-net
