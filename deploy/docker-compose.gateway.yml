# 秒杀系统 · 单实例分解部署(v4 · 2026-10-08)——gateway 独占(4C8G;IP 由 .env HOST_IP 注入)
#
# 【一组件一机】单实例统一入口(web 的 nginx upstream 指向本机:18080);
#   - 限流阈值=单实例口径(.env ⑥;交易 4000 留 33% 余量,避免 3000 档误伤);
#   - JVM 堆 2g + 直接内存 768m(按 4C8G 机器适配)。
# 启动:docker compose -f docker-compose.gateway.yml up -d
name: seckill-gateway

services:

  seckill-gateway:
    image: ${IMAGE_REGISTRY}/seckill-gateway:${IMAGE_TAG}
    container_name: seckill-gateway
    cpus: 3.5
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "${GATEWAY_JAVA_OPTS}"
      GATEWAY_QPS_SERVICE: ${GATEWAY_QPS_SERVICE}
      GATEWAY_QPS_READ: ${GATEWAY_QPS_READ}
      GATEWAY_QPS_ADMIN: ${GATEWAY_QPS_ADMIN}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"

networks:
  default:
    name: seckill-net
