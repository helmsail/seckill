# 秒杀系统 · 单实例分解部署(v4 · 2026-10-08)——service 独占(4C8G · service-1/2 两台)
#
# 【一组件一机】交易核心(热链路):4C8G 为标定起点,瓶颈即加实例;
#   - JVM 堆 2g(沿用);注册/对外地址用宿主内网 IP。
# 启动:docker compose -f docker-compose.service.yml up -d
name: seckill-service

services:

  seckill-service:
    image: ${IMAGE_REGISTRY}/seckill-service:${IMAGE_TAG}
    container_name: seckill-service
    cpus: 3.5
    restart: unless-stopped
    env_file: .env
    environment:
      # 负载均衡:回默认(random)——经 per-host 语句分账实测,流量本就 1:1("偏斜"系 GC 脉冲误读),无需策略干预;策略级固化(如需)留待代码注解
      JAVA_TOOL_OPTIONS: "${SERVICE_JAVA_OPTS}"
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${HOST_IP}
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}
    ports:
      - "${SERVICE_PORT}:${SERVICE_PORT}"

networks:
  default:
    name: seckill-net
