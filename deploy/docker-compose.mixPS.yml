# 秒杀系统 · 混合机 mixPS——processor + support 共置(4C8G;IP 由 .env HOST_IP 注入)
#
# 【合并省机】实测利用率:processor ~30% / support ~3% → 合后整机 ~33%,远低于 4000 档水位:
#   - 不设固定 CPU 配额:两服务弹性共享整机 4 核(固定 3.0/1.0 实测:processor 峰值闲置 0.8 核、support 反被顶在 100.8%);堆 1g + 1g(共 2G 堆,4C8G 富余);
#   - ⚠️ 不要把 Redis 并入本机(上次拆分 Redis 的动机 = 避免与 support 抢核,PING 长尾)。
# 【迁移】由旧 processor 单机切换:先本编排 up -d → 验证(双容器 + 冒烟)→ 再释放原 support 独立机。
# 启动:docker compose -f docker-compose.mixPS.yml up -d
name: seckill-mixps

services:

  seckill-processor:
    image: ${IMAGE_REGISTRY}/seckill-processor:${PROCESSOR_IMAGE_TAG}
    container_name: seckill-processor
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "${PROCESSOR_JAVA_OPTS}"
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}

  seckill-support:
    image: ${IMAGE_REGISTRY}/seckill-support:${IMAGE_TAG}
    container_name: seckill-support
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "${SUPPORT_JAVA_OPTS}"
      DUBBO_IP_TO_REGISTRY: ${HOST_IP}
    ports:
      - "${SUPPORT_PORT}:${SUPPORT_PORT}"
      - "${SUPPORT_DUBBO_PORT}:${SUPPORT_DUBBO_PORT}"

networks:
  default:
    name: seckill-net
