server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: seckill-gateway
  config:
    import:
      - optional:file:.env[.properties]

  cloud:
    # ---------- 路由（lb:// 经服务发现解析实例并负载均衡）----------
    gateway:
      server:
        webflux:
          routes:
            # C 端服务
            - id: seckill-service
              uri: lb://seckill-service
              predicates:
                - Path=/api/c/**
              filters:
                - StripPrefix=2

            # 运营管理端
            - id: seckill-admin
              uri: lb://seckill-admin
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2

    # ---------- Nacos ----------
    nacos:
      # 服务发现：仅用于网关 lb:// 解析后端 Web 实例（隔离靠 group，namespace 保持 public）
      # 未接配置中心（nacos-config 依赖已移除）：网关 Spring 配置本地维护；
      # Sentinel 限流规则支持 Nacos 动态通道（当前未在 Nacos 维护数据，实际生效代码内兜底规则）
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        group: SECKILL_DISCOVERY

    # ---------- Sentinel 限流 ----------
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR}
      datasource:
        # 动态规则通道（当前未在 Nacos 维护数据）：namespace=seckill-sentinel，dataId=seckill-gateway-gw-flow.json，group=SENTINEL_GROUP
        # Nacos 未配置或拉取失败时，由 GatewayRuleInitializer 装载兜底规则（C 端 3500 / 运营端 500 QPS），限流不失效
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR}
            username: ${NACOS_USERNAME}
            password: ${NACOS_PASSWORD}
            namespace: seckill-sentinel
            data-id: seckill-gateway-gw-flow.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow

# ---------- JWT（与 support-server 保持同一 secret，令牌由 support-server 签发）----------
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
