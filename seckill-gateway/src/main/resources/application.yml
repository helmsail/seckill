server:
  port: 18080

spring:
  application:
    name: seckill-gateway
  config:
    import:
      - optional:nacos:seckill-gateway.yml
      - optional:file:.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # C 端服务
            - id: seckill-service
              uri: http://${SECKILL_SERVICE_HOST}:18084
              predicates:
                - Path=/api/consumer/**
              filters:
                - StripPrefix=2

            # 运营管理端
            - id: seckill-admin
              uri: http://${SECKILL_ADMIN_HOST}:18082
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2

    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR}
      datasource:
        # 网关限流规则，从 Nacos 动态读取
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR}
            username: ${NACOS_USERNAME}
            password: ${NACOS_PASSWORD}
            namespace: public
            data-id: ${spring.application.name}-sentinel-gw-flow.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow

  nacos:
    config:
      server-addr: ${NACOS_ADDR}
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      file-extension: yml

# JWT（与 support-server 保持同一 secret，令牌由 support-server 签发）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
