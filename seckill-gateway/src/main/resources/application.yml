server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: seckill-gateway
  config:
    import:
      - optional:file:.env[.properties]

  cloud:
    # ---------- 路由（lb:// 经服务发现解析实例并负载均衡）----------
    gateway:
      server:
        webflux:
          routes:
            # C 端读流量（轮询/查询：结果键轮询、订单状态轮询、活动/商品/库存浏览）
            # ⚠️ 必须声明在下方“C 端交易”之前——Path 谓词按声明顺序首个命中生效
            - id: seckill-service-read
              uri: lb://seckill-service
              predicates:
                - Path=/api/c/seckill/poll,/api/c/order/**,/api/c/activity/**
              filters:
                - StripPrefix=2

            # C 端交易（秒杀提交、支付、登录）
            - id: seckill-service
              uri: lb://seckill-service
              predicates:
                - Path=/api/c/**
              filters:
                - StripPrefix=2

            # 运营管理端
            - id: seckill-admin
              uri: lb://seckill-admin
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2

    # ---------- Nacos ----------
    nacos:
      # 服务发现：仅用于网关 lb:// 解析后端 Web 实例（隔离靠 group，namespace 保持 public）
      # 未接配置中心（nacos-config 依赖已移除）：网关 Spring 配置本地维护；
      # Sentinel 限流规则支持 Nacos 动态通道（当前未在 Nacos 维护数据，实际生效代码内兜底规则）
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        group: SECKILL_DISCOVERY

    # ---------- Sentinel 限流 ----------
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR}
      datasource:
        # 动态规则通道（当前未在 Nacos 维护数据）：namespace=seckill-sentinel，dataId=seckill-gateway-gw-flow.json，group=SENTINEL_GROUP
        # Nacos 未配置或拉取失败时，由 GatewayRuleInitializer 装载兜底规则（阈值见下方 gateway.ratelimit.qps），限流不失效
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR}
            username: ${NACOS_USERNAME}
            password: ${NACOS_PASSWORD}
            namespace: seckill-sentinel
            data-id: seckill-gateway-gw-flow.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow

# ---------- 网关限流阈值（兜底规则唯一来源；环境变量优先，未设时用冒号后默认值）----------
# 口径说明：Sentinel 按实例独立计数，此阈值 = 本实例承载上限
#   - 单实例（本地）：交易 6000 / 读 12000 / 运营端 500 = 总目标口径；
#   - 多实例（云端 G1~G3 三实例）：每实例 = 总目标 ÷ 实例数 → 交易 2000 / 读 4000 / 运营端 500（由 .env 注入 GATEWAY_QPS_*）。
gateway:
  ratelimit:
    qps:
      admin: ${GATEWAY_QPS_ADMIN}
      service: ${GATEWAY_QPS_SERVICE}
      service-read: ${GATEWAY_QPS_READ}

# ---------- JWT（与 support-server 保持同一 secret，令牌由 support-server 签发）----------
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
