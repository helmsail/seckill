# 秒杀系统全容器化编排（开发/演示）
#
# ========== 前置步骤 ==========
#   1. mvn package -DskipTests                 （生成各服务可执行 jar）
#   2. cp .env.example .env                    （按需修改密码等变量）
#   3. docker compose up -d --build            （首次启动自动初始化 MySQL：建库建表 + xxl-job 表结构与任务预置，见 docker/mysql/initdb/）
#
# ========== 端口（宿主）==========
#   gateway 18080 | base 18081 | admin 18082 | job 18083 | service 18084 | processor 18085 | support 18086
#   xxl-job-admin 8080 | nacos 8848/9848 | sentinel-dashboard 8858 | mysql 3306 | redis 6379 | rocketmq 9876/10911
#
# 说明：应用容器通过 env_file 注入 .env；中间件配置直接使用 .env 变量替换（compose 自动读取项目根 .env）
# 数据策略：数据全部存放容器内部（不挂外部卷）——stop/restart 保留数据，容器删除（down/重建）即重置

name: seckill

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      # 首次初始化（数据目录为空时执行）：initdb 目录统一维护（建库建表 + xxl-job 初始化，按字母序执行）
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: seckill-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

  rocketmq-namesrv:
    # 本地镜像（基于官方镜像预建 logs/store 目录，属主 rocketmq），详见 docker/rocketmq/Dockerfile
    build: ./docker/rocketmq
    image: seckill-rocketmq
    container_name: seckill-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "9876:9876"

  rocketmq-broker:
    # 本地镜像（基于官方镜像预建 logs/store 目录，属主 rocketmq），详见 docker/rocketmq/Dockerfile（曾表现为退出码 253 无限重启）
    build: ./docker/rocketmq
    image: seckill-rocketmq
    container_name: seckill-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.5.0
    container_name: seckill-xxl-job-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # accessToken 置空与项目 executor 保持一致；未导入 xxl_job 表前会反复重启（导入后自动恢复）
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=${MYSQL_USERNAME:-root}
        --spring.datasource.password=${MYSQL_PASSWORD:-root}
        --xxl.job.accessToken=
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  sentinel-dashboard:
    # 社区镜像；若拉取失败可注释本服务（同步删去 gateway 的 sentinel-dashboard 依赖，否则 compose 报 depends on undefined service； gateway 连不上 dashboard 不影响运行）
    image: bladex/sentinel-dashboard:1.8.8
    container_name: seckill-sentinel-dashboard
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "8858:8858"

  # ==================== 应用服务（先 mvn package 再 --build）====================

  seckill-gateway:
    build: ./seckill-gateway
    image: seckill-gateway
    container_name: seckill-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"

  seckill-base:
    build: ./seckill-base/seckill-base-server
    image: seckill-base
    container_name: seckill-base
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    ports:
      - "${BASE_SERVER_PORT}:${BASE_SERVER_PORT}"

  seckill-admin:
    build: ./seckill-admin
    image: seckill-admin
    container_name: seckill-admin
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"

  seckill-job:
    build: ./seckill-job
    image: seckill-job
    container_name: seckill-job
    restart: unless-stopped
    env_file: .env
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      xxl-job-admin:
        condition: service_started
    ports:
      - "${JOB_PORT}:${JOB_PORT}"

  seckill-service:
    build: ./seckill-service
    image: seckill-service
    container_name: seckill-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
    ports:
      - "${SERVICE_PORT}:${SERVICE_PORT}"

  seckill-processor:
    build: ./seckill-processor
    image: seckill-processor
    container_name: seckill-processor
    restart: unless-stopped
    env_file: .env
    depends_on:
      nacos:
        condition: service_started
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
    ports:
      - "${PROCESSOR_PORT}:${PROCESSOR_PORT}"

  seckill-support:
    build: ./support/support-server
    image: seckill-support
    container_name: seckill-support
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    ports:
      - "${SUPPORT_PORT}:${SUPPORT_PORT}"
