<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秒杀运营管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="logo">秒杀运营管理</span>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="btn btn-sm" id="btnLogout" hidden>退出</button>
    </div>
  </header>

  <main class="page">
    <!-- 登录视图 -->
    <section id="view-login" hidden>
      <div class="card login-card">
        <h1>运营管理</h1>
        <p class="hint">测试账号：admin / admin123，operator01 / 123456</p>
        <form id="formLogin">
          <div class="field">
            <label for="loginUser">用户名</label>
            <input class="input" id="loginUser" required autocomplete="username">
          </div>
          <div class="field">
            <label for="loginPass">密码</label>
            <input class="input" id="loginPass" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit">登 录</button>
        </form>
      </div>
    </section>

    <!-- 活动列表视图 -->
    <section id="view-list" hidden>
      <div class="row between" style="margin-bottom: 12px">
        <p class="section-title" style="margin: 0">活动管理</p>
        <div class="row">
          <select class="input" id="filterStatus" style="width: 130px">
            <option value="">全部状态</option>
            <option value="PENDING">待开始</option>
            <option value="ACTIVE">进行中</option>
            <option value="PAUSED">已暂停</option>
            <option value="CLOSED">已关闭</option>
          </select>
          <button class="btn btn-primary" id="btnCreate">+ 新建活动</button>
        </div>
      </div>
      <div class="card" style="padding: 0">
        <div class="table-wrap"><table class="table" id="activityTable"></table></div>
      </div>
    </section>

    <!-- 活动详情视图 -->
    <section id="view-detail" hidden>
      <div class="row" style="margin-bottom: 12px">
        <button class="btn btn-sm" id="btnBack">← 返回</button>
      </div>
      <div class="card" id="detailHead"></div>
      <div class="row between" style="margin-bottom: 10px">
        <p class="section-title" style="margin: 0">活动商品</p>
        <div class="row" id="detailTools"></div>
      </div>
      <div class="card" style="padding: 0">
        <div class="table-wrap"><table class="table" id="skuTable"></table></div>
      </div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
