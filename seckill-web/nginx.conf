# 秒杀前端站点：静态页面 + API 反向代理（/api → 网关容器，同源免 CORS）

server {
    listen 80;

    # 静态页面（C 端 index.html，运营端 admin.html）
    root /usr/share/nginx/html;
    index index.html;

    # 管理端快捷入口
    location = /admin {
        return 302 /admin.html;
    }

    # API 统一走网关（保留 /api 前缀原样转发）；Docker 内嵌 DNS 运行时解析，网关重建换 IP 后自动恢复
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_gateway http://seckill-gateway:18080;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
