server:
  port: 8083

spring:
  application:
    name: seckill-job
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xxl_job?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379

dubbo:
  application:
    name: seckill-job
    qos-enable: false
  registry:
    address: nacos://127.0.0.1:8848
  consumer:
    check: false

xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    executor:
      appname: seckill-job
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
