server:
  port: ${JOB_PORT}

spring:
  application:
    name: seckill-job
  config:
    import:
      - optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

dubbo:
  application:
    name: seckill-job
    qos-enable: false
  registry:
    # namespace 保持 public，隔离靠 group
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}&group=SECKILL_DUBBO
  consumer:
    check: false
    # 超时放宽覆盖冷启动/多段远程调用；重试未逐引用声明，沿用框架默认
    timeout: 5000

rocketmq:
  name-server: ${ROCKETMQ_ADDR}
  producer:
    group: seckill-producer
    # 首次向新 topic 发送时 broker 自动创建较慢，默认 3s 易误报超时
    send-message-timeout: 5000

xxl:
  job:
    admin:
      addresses: ${XXL_ADMIN_ADDR}
    executor:
      appname: seckill-job
      # 执行器注册地址（2.4+ 优先于 ip）：必须为宿主内网 IP，否则自报容器内网 IP 导致跨机回调不通
      address: http://${HOST_IP}:${XXL_EXECUTOR_PORT}/
      port: ${XXL_EXECUTOR_PORT}
      logpath: ${XXL_EXECUTOR_LOGPATH}
      logretentiondays: 30
