server:
  port: 18083

spring:
  application:
    name: seckill-job
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/xxl_job?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

dubbo:
  application:
    name: seckill-job
    qos-enable: false
  registry:
    # namespace 保持 public，隔离靠 group（与 Spring Cloud 的 SECKILL_DISCOVERY 隔离）
    address: nacos://${NACOS_ADDR}?username=${NACOS_USERNAME}&password=${NACOS_PASSWORD}&group=SECKILL_DUBBO
  consumer:
    check: false
    # 重试不设全局默认，逐引用按读写性质在 @DubboReference(retries = n) 上显式声明
    # 冷启动/多段远程调用场景放宽超时
    timeout: 5000

rocketmq:
  name-server: ${ROCKETMQ_ADDR}
  producer:
    group: seckill-producer
    # 首次向新 topic 发送时 broker 自动创建较慢，默认 3s 易误报超时
    send-message-timeout: 5000

xxl:
  job:
    admin:
      addresses: ${XXL_ADMIN_ADDR}
    executor:
      appname: seckill-job
      port: 19999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
